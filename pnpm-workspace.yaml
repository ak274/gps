packages:
  - "apps/*"
  - "libs/shared/*"
  - "libs/server/*"
  - "libs/web/*"
  - "packages/*"
allowBuilds:
  '@nestjs/core': true
  '@parcel/watcher': true
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': false
  '@swc/core': true
  core-js: false
  esbuild: true
  fsevents: true
  less: false
  msw: false
  nodemon: false
  nx: true
  prisma: true
  unrs-resolver: true
autoInstallPeers: true
